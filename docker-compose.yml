services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "81:81"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - admin-frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./admin-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: bitbench-runner:latest
    command: ["/bin/true"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./compression/benchmark
        - action: rebuild
          path: ./compression/lib
    secrets:
      - jwt_secret
      - db_password
      - redis_password
      - smtp_password
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=bitbench
      - DB_NAME=bitbench
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_EXPIRY=24h
      # Total worker budget: defaults to the cores allocatable to this
      # container (cgroup-aware). Uncomment to pin an explicit cap.
      # - MAX_PARALLELISM=8
      - MAX_FILE_SIZE_MB=500
      - BENCH_TIMEOUT_SECONDS=3600
      - BENCH_MAX_RETRIES=2
      - DATA_DIR=/data/benchmarks
      - BENCH_BINARY_PATH=/app/bin/LosslessBenchmarkFull
      - COMPRESSOR_DIR=/data/compressors
      - MAX_PACKAGE_SIZE_MB=50
      - RUNNER_IMAGE=bitbench-runner:latest
      - RUNNER_MEMORY_MB=4096
      - RUNNER_PIDS_LIMIT=512
      - BUILD_TIMEOUT_SECONDS=600
      - BENCH_VOLUME=bitbench_bench_data
      - COMPRESSOR_VOLUME=bitbench_compressor_data
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - bench_data:/data/benchmarks
      - compressor_data:/data/compressors
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      runner:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    secrets:
      - db_password
    environment:
      - POSTGRES_USER=bitbench
      - POSTGRES_DB=bitbench
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitbench"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: redis:latest
    secrets:
      - redis_password
    command: >
      sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  bench_data:
    driver: local
    name: bitbench_bench_data
  compressor_data:
    driver: local
    name: bitbench_compressor_data
  pg_data:
    driver: local

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
