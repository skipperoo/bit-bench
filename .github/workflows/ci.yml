name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: cd backend && go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npx tsc --noEmit
      - run: cd admin-frontend && npm ci && npx tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: cd backend && go test ./internal/compressor/... ./internal/model/... ./internal/middleware/... ./internal/service/... ./internal/worker/...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npx vitest run

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: ./runner
          tags: bitbench-runner:e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: cd backend && go test -tags=integration -count=1 ./internal/handler/... ./internal/worker/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: cd backend && go build ./cmd/bitbench-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci && npm run build
      - run: cd admin-frontend && npm ci && npm run build
