name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npx eslint src/ && npx tsc --noEmit
        working-directory: frontend
      - run: npm ci && npx eslint src/ && npx tsc --noEmit
        working-directory: admin-frontend

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./...
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npx vitest run
        working-directory: frontend

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test -tags=integration ./...
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./cmd/bitbench-backend
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npm run build
        working-directory: admin-frontend
