name: huff_delta
version: "1.1.0"
description: >-
  Lossy-then-Huffman delta codec: the sequence is quantized by discarding N
  LSBs (device round-to-nearest quantizer), delta-coded and entropy-coded with
  a canonical Huffman table trained on the first chunks of the same file, with
  an escape symbol and per-chunk escape width for values outside the table.
  Chunks where the Huffman payload would expand are replaced by an exact
  raw/zig-zag-LEB128 fallback. Lossless when drop_bits = 0.
language: c
entrypoint: ./codec
workers: 1
build:
  command: make -j2
  timeout_seconds: 600
options:
  drop_bits:
    type: number
    min: 0
    max: 15
    default: 4
    step: 1
  mode:
    type: select
    options: [lossy, lossless]
    default: lossy
  table_k:
    type: number
    min: 16
    max: 2047
    default: 255
    step: 1
  adaptive:
    type: boolean
    default: false
  refresh:
    type: number
    min: 1
    max: 4096
    default: 64
    step: 1
